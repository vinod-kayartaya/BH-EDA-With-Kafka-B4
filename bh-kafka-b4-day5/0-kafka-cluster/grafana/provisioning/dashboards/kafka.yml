---
# ============================================================
# Grafana Dashboard Provisioning
# Auto-loads all JSON dashboards from /var/lib/grafana/dashboards
# ============================================================
apiVersion: 1

providers:
  - name: "kafka-dashboards"
    orgId: 1
    folder: "Kafka"
    folderUid: "kafka"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
